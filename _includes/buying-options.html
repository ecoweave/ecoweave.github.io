
<dl class="dl-horizontal">

  {% unless product.size == nil %}
  <dt>Size</dt>
  <dd>{{product.size}}</dd>
  {% endunless %}

  {% unless product.closure == nil %}
  <dt>Closure</dt>
  <dd>{{product.closure}}</dd>
  {% endunless %}

  <dt>
    <input type="hidden" name="on0" value="Type">Price
  </dt>
  <dd>
    <select name="os0" id="{{product.id}}-type">
    {% for variations in product.options %}
      {% for variation in variations %}
        <option value="{{ variation[0] }}">{{ variation[0] }} {{ variation[1] }}</option>
      {% endfor %}
    {% endfor %}
    </select>
  </dd>


  {% if product.colors != empty %}
  <dt id="{{product.id}}-colours-dt">
    <input type="hidden" name="on1" value="Colour">Colour
  </dt>
    <dd id="{{product.id}}-colours-dd">
      <select name="os1" id="{{product.id}}-colours-select">
        {% for color in product.colors %}
        <option value="{{color}}">{{color}} </option>
        {% endfor %}
    </select>
  </dd>
  {% endif %}
</dl>

<script type="text/javascript">
$(document).ready(function ($) {
  // The "Not Applicable" colour is added and removed from the DOM rather than
  // hidden with CSS: iOS renders selects as a native picker that ignores
  // display:none on options, so a hidden option is still listed on iPhone.
  var colours = $("#{{product.id}}-colours-select");

  $("#{{product.id}}-type").change(function(){
    if(this.value == "Barcode") {
      $("#{{product.id}}-colours-dt").hide();
      $("#{{product.id}}-colours-dd").hide();
      if (colours.find("option[value='Not Applicable']").length === 0) {
        colours.append($("<option>").val("Not Applicable").text("Not Applicable"));
      }
      colours.val("Not Applicable");
    } else {
      $("#{{product.id}}-colours-dt").show();
      $("#{{product.id}}-colours-dd").show();
      colours.find("option[value='Not Applicable']").remove();
      colours[0].selectedIndex = 0;
    }
  })
});
</script>
